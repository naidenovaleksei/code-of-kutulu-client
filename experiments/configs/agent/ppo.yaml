train: true
type: ppo
state_type: conv_ext
use_deep: false

# Model parameters
model_params:
  fc_dim: 16
  conv_dim: 8
  size: 3

# Training parameters
gamma: 0.52
lr: 0.001
optimizer: adamw
scheduler_params:
  type: cosine
  T_max: ${trainer.num_experiments}

# PPO specific parameters
entropy_coef: 0.5
value_loss_coef: 0.85
terminate_loss_coef: 0.08
occupation_loss_coef: 0.0
clip_ratio: 0.12
ppo_epochs: 4
mini_batch_size: 16
target_kl: 0.77
max_grad_norm: 0.96
gae_lambda: 0.86

# Reward shaping parameters
reward_params:
  gamma: 0.90
  lights_left_coef: 0.08
  light_potential_coef: 0.08
  plans_left_coef: 0.16
  plan_potential_coef: 0.04
  yell_potential_coef: 0.03
  w_nearby_potential_coef: 0.0
  e_nearby_potential_coef: 0.35
  s_nearby_potential_coef: 0.06
  sanity_loss_potential_coef: 0.07
  no_move_reward_coef: 0.01
