train: true
type: ppo
state_type: conv

# Model parameters
model_params:
  fc_dim: 16
  conv_dim: 8
  size: 3

# Training parameters
gamma: 0.90
lr: 0.001
optimizer: adamw
scheduler_params:
  type: cosine
  T_max: ${trainer.num_experiments}

# PPO specific parameters
entropy_coef: 1.4
value_loss_coef: 0.5
clip_ratio: 0.04
ppo_epochs: 4
mini_batch_size: 16
target_kl: 0.15
max_grad_norm: 0.15
gae_lambda: 0.99
explicit_action_mask: null

# Reward shaping parameters
reward_params:
  gamma: 0.99
  lights_left_coef: 0.1
  light_potential_coef: 0.8
  plans_left_coef: 0.03
  plan_potential_coef: 0.01
  yell_potential_coef: 0.0
  w_nearby_potential_coef: 0.3
  e_nearby_potential_coef: 0.3
  s_nearby_potential_coef: 0.3
  sanity_loss_potential_coef: 0.1
  no_move_reward_coef: 0.0
